version: 2
updates:
  # Python dependencies
  # requirements-dev.txt at the root and each distribution's pyproject.toml.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/packages/rl-core"
      - "/packages/rl-navigation"
      - "/packages/rl-challenges"
    # This repository's own distributions: not on PyPI, where anyone could register the names.
    ignore:
      - dependency-name: "rl-core"
      - dependency-name: "rl-navigation"
      - dependency-name: "rl-challenges"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "andreijw"
    labels:
      - "dependencies"
      - "python"
    # One PR per week for all pip updates, so one CI run instead of one per package.
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "andreijw"
    labels:
      - "dependencies"
      - "github-actions"
    # Actions are pinned to commit SHAs with a version comment; Dependabot bumps both, in one PR.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

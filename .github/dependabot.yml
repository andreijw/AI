version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "andreijw"
    labels:
      - "dependencies"
      - "python"
    # One PR per week for all pip updates, so one CI run instead of one per package.
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "andreijw"
    labels:
      - "dependencies"
      - "github-actions"
    # Actions are pinned to commit SHAs with a version comment; Dependabot bumps both, in one PR.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

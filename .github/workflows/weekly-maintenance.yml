name: Weekly Maintenance

# Re-runs every pull request check on develop once a week: merges are not re-tested (the ruleset does
# not require up-to-date branches), and new releases of unpinned dev tools can break a green tree.
# No concurrency block here: ci.yml's own block evaluates in this caller's context, and a caller and
# callee sharing one group would cancel each other.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan develop
    uses: ./.github/workflows/ci.yml

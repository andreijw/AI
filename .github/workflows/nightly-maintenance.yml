name: Nightly Maintenance

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  scan-and-sync-docs:
    name: Scan Code and Sync Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run code scans
        run: |
          ruff check .
          ruff format --check .
          mypy src/
          pytest -q
          bandit -r src/ -ll
          pylint src --disable=all --enable=duplicate-code --min-similarity-lines=20 --ignore-imports=yes --ignore-signatures=yes

      - name: Sync README workflow documentation
        run: python scripts/sync_workflow_docs.py

      - name: Create pull request for documentation updates
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'docs: sync workflow documentation'
          title: 'docs: nightly workflow documentation sync'
          body: |
            ## Summary
            - ran nightly code scans
            - synchronized README workflow documentation with .github/workflows

            ## Notes
            - this PR was created automatically by the nightly maintenance workflow
          branch: chore/nightly-docs-sync
          delete-branch: true

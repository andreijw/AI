name: CI

# The ruleset does not require branches to be up to date before merging, so a merge into develop is
# not the tree its pull request tested; Weekly Maintenance re-runs this workflow on develop. `main`
# does not exist today; the push trigger covers it if it is ever created as a release branch.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Python version is in .python-version and every package version in requirements-lock.txt; this file defines
# only markdownlint-cli's (tests/test_versions.py holds .pre-commit-config.yaml to it).
env:
  MARKDOWNLINT_CLI_VERSION: '0.39.0'

jobs:
  # Required status checks are these job names: "Checks" and "Unit Tests". Renaming one blocks merges
  # until the BasicProtection ruleset is updated (tests/test_ci_policy.py REQUIRED_CHECKS).
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # If detection fails the job fails; steps that still run (`!cancelled()`) see an empty output and
      # treat the change as not docs-only.
      - name: Detect docs-only change
        id: docs
        uses: ./.github/actions/docs-only

      # Each check runs if the steps it needs succeeded, so one failure does not hide the others.
      - name: Check README workflow list
        if: ${{ !cancelled() }}
        run: python3 -I scripts/sync_workflow_docs.py --check

      - name: Check Markdown links
        if: ${{ !cancelled() }}
        run: python3 -I scripts/check_doc_links.py

      - name: Run markdownlint
        if: ${{ !cancelled() }}
        run: npx --yes "markdownlint-cli@$MARKDOWNLINT_CLI_VERSION" '**/*.md' --ignore node_modules

      - name: Set up Python
        if: ${{ !cancelled() && steps.docs.outputs.docs_only != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
            packages/*/pyproject.toml

      # Every distribution under packages/, editable, and the dev tools (requirements-dev.txt).
      - name: Install the distributions with dev dependencies
        id: install
        if: ${{ !cancelled() && steps.docs.outputs.docs_only != 'true' }}
        run: |
          python -m pip install --upgrade pip -c requirements-lock.txt
          pip install -r requirements-dev.txt -c requirements-lock.txt

      - name: Run Ruff linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Run Ruff formatter check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Run MyPy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

      - name: Run Bandit security scanner
        id: bandit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rc=0
          bandit -r packages/ benchmark.py -ll -f json -o bandit-report.json || rc=$?
          cat bandit-report.json
          exit "$rc"

      - name: Upload Bandit report
        if: ${{ !cancelled() && steps.bandit.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Check for duplicate code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pylint packages/*/src benchmark.py --disable=all --enable=duplicate-code --min-similarity-lines=20
          --ignore-imports=yes --ignore-signatures=yes

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect docs-only change
        id: docs
        uses: ./.github/actions/docs-only

      - name: Set up Python
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
            packages/*/pyproject.toml

      # requirements-dev.txt includes rl-core's onnx extra: small prebuilt wheels, so the ONNX export tests
      # run here (unlike torch and box2d).
      - name: Install the distributions with dev and onnx dependencies
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: |
          python -m pip install --upgrade pip -c requirements-lock.txt
          pip install -r requirements-dev.txt -c requirements-lock.txt

      # The --cov sources (each package's src/ and benchmark) and --cov-report come from addopts in pyproject.toml.
      - name: Run tests with coverage
        id: pytest
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: pytest --cov-report=xml --cov-fail-under=50

      # Pull requests only: called and scheduled runs receive no secrets. Fork and Dependabot PRs get no
      # token either, which fail_ci_if_error: false tolerates.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.pytest.outcome != 'skipped' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 3
          if-no-files-found: ignore

  # Not a required check. Builds every distribution under packages/, installs each wheel in a fresh environment
  # and imports it (scripts/release.py smoke-all: rl-navigation's plain install may load only NumPy), then runs
  # the robot-side tests from the rl-navigation wheel alone on its NumPy floor (1.26, ROS 2 Jazzy's).
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect docs-only change
        id: docs
        uses: ./.github/actions/docs-only

      - name: Set up Python
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
            packages/*/pyproject.toml

      - name: Build every distribution
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: |
          python -m pip install --upgrade pip build packaging -c requirements-lock.txt
          for package in packages/*/; do python -m build "$package" --outdir dist/; done

      - name: Install each wheel in a fresh environment and import it
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: python scripts/release.py smoke-all dist/

      # NumPy deliberately overrides the lock's: rl-navigation's own NumPy floor (ROS 2 Jazzy's), read from its
      # pyproject.toml so the leg follows the floor; pytest still comes from the lock. Only the
      # rl-navigation wheel is installed (no rl-core, no Gymnasium), and --noconftest skips tests/conftest.py, which
      # imports rl_core: the robot side must work with NumPy alone.
      - name: Robot-side tests from the rl-navigation wheel alone on its NumPy floor
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: |
          numpy_floor=$(python scripts/release.py floor rl-navigation numpy)
          python -m venv "$RUNNER_TEMP/numpy-floor"
          grep -v '^numpy==' requirements-lock.txt > "$RUNNER_TEMP/lock-without-numpy.txt"
          "$RUNNER_TEMP/numpy-floor/bin/pip" install "numpy==$numpy_floor.*" dist/rl_navigation-*.whl pytest \
            -c "$RUNNER_TEMP/lock-without-numpy.txt"
          "$RUNNER_TEMP/numpy-floor/bin/python" -m pytest -q --noconftest -o addopts="" \
            tests/test_ekf_localization.py tests/test_ekf_slam.py tests/test_estimation_evaluation.py \
            tests/test_kalman.py tests/test_localization_comparison.py tests/test_localization_recording.py \
            tests/test_mapping_beams.py tests/test_mapping_evaluation.py tests/test_mapping_grid.py \
            tests/test_mcl_localization.py tests/test_navigation_geometry.py tests/test_navigation_layouts.py \
            tests/test_navigation_motion.py tests/test_navigation_odometry.py tests/test_navigation_render.py \
            tests/test_navigation_sensors.py tests/test_slam_evaluation.py tests/test_slam_feature_evaluation.py \
            tests/test_slam_features.py

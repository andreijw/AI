[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-cartpole"
version = "0.1.0"
description = "A pure-NumPy reinforcement-learning framework and robot navigation library, built toward a Jetson robot"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "andreijw"}
]
keywords = ["reinforcement-learning", "cartpole", "gym", "gymnasium", "rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9.4",
]

[project.optional-dependencies]
video = [
    "moviepy>=1.0.0",
    "imageio-ffmpeg>=0.4.0",
    "gymnasium[classic-control]>=1.0.0",
]
# The optional PyTorch backend (backend: torch). On the Jetson it installs from PyTorch's own index:
# see docs/pytorch_jetson_timing.md.
torch = [
    "torch>=2.14",
]
# LunarLander and BipedalWalker (Box2D). Gymnasium's own box2d extra pins box2d==2.3.10, which has no aarch64 build;
# box2d-py builds from source with swig, which pip's isolated build cannot find, so install it first
# as ./setup.sh does (docs/usage.md, LunarLander (Box2D)). Rendering uses pygame-ce, as Gymnasium does.
box2d = [
    "box2d-py==2.3.8",
    "pygame-ce>=2.1.3",
]
# ONNX export (export.py --format onnx): onnx builds and checks the model, onnxruntime verifies it.
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.1.0",
    "bandit[toml]>=1.8.6",
    "pylint>=4.0.0",
    "pre-commit>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/andreijw/AI"
Repository = "https://github.com/andreijw/AI"
Issues = "https://github.com/andreijw/AI/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
# Allow incomplete types for now
allow_incomplete_defs = true
# Don't error on missing type stubs
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # RecordVideo warns, in colour, when its folder already exists: a test or train.py made it.
    "error:.*Overwriting existing videos:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files
# Matrices keep the Kalman filter's names (F, G, H, P, Q, R, K, S), as in the literature.
"src/rl_navigation/estimation/*.py" = ["N803", "N806"]
"src/rl_navigation/slam/{ekf_slam,evaluation}.py" = ["N803", "N806"]
"tests/test_{ekf_localization,kalman,slam_evaluation}.py" = ["N806"]
"tests/test_ekf_slam.py" = ["N803", "N806"]

[tool.bandit]
exclude_dirs = ["/tests", "/test"]
# Test files are in separate test directories, no need to exclude by pattern

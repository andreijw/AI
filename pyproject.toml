# Tool configuration for the whole repository. It is not a distribution: the distributions are
# packages/rl-core, packages/rl-navigation and packages/rl-challenges, each with its own pyproject.toml
# (which must not have a [tool.ruff] table: Ruff uses the closest one that does, without merging).
# Development environment: python -m pip install -r requirements-dev.txt (./setup.sh does it).

[tool.mypy]
python_version = "3.12"
files = ["packages/*/src", "benchmark.py"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
# Allow incomplete types for now
allow_incomplete_defs = true
# Don't error on missing type stubs
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage names each src/ root, not packages/: coverage looks for never-imported files only below a
# source directory's packages, so --cov=packages would silently drop modules no test imports (torch_*).
addopts = "-v --cov=packages/rl-core/src --cov=packages/rl-navigation/src --cov=packages/rl-challenges/src --cov=benchmark --cov-report=term-missing"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # RecordVideo warns, in colour, when its folder already exists: a test or train.py made it.
    "error:.*Overwriting existing videos:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# First-party code for import sorting: every distribution's src/ and the root scripts.
src = ["packages/*/src", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files
# Matrices keep the Kalman filter's names (F, G, H, P, Q, R, K, S), as in the literature.
"packages/rl-navigation/src/rl_navigation/estimation/*.py" = ["N803", "N806"]
"packages/rl-navigation/src/rl_navigation/slam/{ekf_slam,evaluation}.py" = ["N803", "N806"]
"tests/test_{ekf_localization,kalman,slam_evaluation}.py" = ["N806"]
"tests/test_ekf_slam.py" = ["N803", "N806"]

[tool.bandit]
exclude_dirs = ["/tests", "/test"]
# Test files are in separate test directories, no need to exclude by pattern

# Pendulum Continuous Actor-Critic Training Configuration

environment:
  name: "Pendulum-v1"
  render_mode: null
  max_episode_steps: 200
  seed: 42

agent:
  type: "actor_critic"
  config:
    learning_rate: 0.0003
    gamma: 0.99
    hidden_dim: 128
    value_coef: 0.5
    entropy_coef: 0.001
    action_low: -2.0
    action_high: 2.0
    seed: 42

training:
  total_steps: 1000000  # Environment steps (rl-zoo A2C Pendulum-v1 n_timesteps)
  max_steps_per_episode: 200
  eval_frequency: 25
  save_frequency: 50
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

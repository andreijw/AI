# Navigation-v0 Deep Q-Network (DQN) Training Configuration
# configs/lunarlander_dqn.yaml's settings (rl-baselines3-zoo's "Tuned" DQN, one hidden layer of 256), its measured
# exploration floor of 0.1 included, with these differences:
# - epsilon falls over the first 30,000 training actions (10% of the budget; LunarLander 12,000, 4%), about 300
#   random-length episodes of this environment;
# - learning starts at 1,000 stored transitions instead of 128, so the first batches draw from about 10 random
#   episodes rather than from the first one or two;
# - the update cap is the 400-step episode limit, so one gradient step per transition is never cut;
# - rl-zoo's own TD loss, Huber (SB3's smooth-L1, delta 1), where lunarlander_dqn.yaml keeps squared error;
# - the learning rate decays linearly to zero over the whole 300,000-step budget (rl-zoo: fixed).
# The trainer updates once per episode. The budget is LunarLander's 300,000 steps.
# Measured 2026-11-06 with squared error and a fixed rate, on seeds 1 to 5 through the benchmark: 11% of greedy
# episodes on 100 held-out layouts reached the goal (0 to 50% a seed), against discrete PPO's 88% (CHANGELOG.md,
# 2026-11-06). The training-doctor diagnosis (2026-11-06) found two causes. First, the -10 collision is about 200
# times a step's reward std (0.046): collisions, 0.2% of transitions, carried about 10% of the squared-error
# gradient, mean Q rose to 12-18 where no return exceeds about 10, and TD noise (RMS 0.46) swamped the 0.07 gap
# between the two best actions. Second, a fixed rate kept the greedy policy flipping (Huber alone on seed 1:
# 83%, then 10, 0, 24%). Scratch probes, 100 layouts (reset seeds 100,000 and up) from the last checkpoint:
# Huber with the decaying rate 98, 96 and 94% on seeds 1, 2 and 4; the decaying rate alone 77% on seed 1; double
# DQN, dueling and an epsilon floor of 0.02 failed on seed 1. This config's result on seeds 1 to 5 through the
# benchmark (2026-11-07, final weights, 100 held-out layouts): 94% at the goal, 89 to 96% by seed.
# Against the 7.0 threshold it solves and holds on 5 of 5 seeds (docs/benchmarks/navigation_results.md).

environment:
  name: "Navigation-v0"
  render_mode: null
  max_episode_steps: 400
  seed: 42
  sensor: "hc_sr04"  # five HC-SR04 sonars; "lidar" for a lidar of lidar_beams beams
  num_obstacles: 6

agent:
  type: "dqn"
  config:
    optimizer: adam                # rl-zoo / SB3 optimizer
    learning_rate: 0.00063         # rl-zoo's rate at the start; anneal_steps decays it to 0
    max_grad_norm: 10.0            # Adam global gradient-norm clip (SB3 default)
    gamma: 0.99                    # Discount factor (rl-zoo)
    hidden_dim: 256                # One hidden layer (rl-zoo: [256, 256])
    buffer_capacity: 50000         # Replay buffer capacity (rl-zoo): about the last 200 episodes
    batch_size: 128                # Training mini-batch size (rl-zoo)
    min_buffer_size: 1000          # About 15 random episodes before the first batch (LunarLander: 128)
    epsilon_start: 1.0             # Initial exploration probability
    epsilon_end: 0.1               # Exploration floor (rl-zoo; LunarLander held 5 of 5 against 3 of 5 for 0.02)
    exploration_steps: 30000       # Training actions over which epsilon falls linearly
    target_update_frequency: 250   # Gradient steps between target syncs (rl-zoo's 250 x 1 update per step)
    updates_per_step: 1.0          # Gradient steps per transition
    max_updates_per_call: 400      # The episode limit, so the cap never binds
    td_loss: huber                 # Huber TD loss (rl-zoo / SB3 smooth-L1): a TD error beyond delta pulls with delta
    huber_delta: 1.0               # Huber threshold delta, in reward units (SB3 default)
    anneal_steps: 300000           # Learning rate decays linearly to 0 over these transitions (the whole budget)
    seed: 42                       # Weight initialisation and sampling seed

training:
  total_steps: 300000  # Environment steps (as LunarLander DQN)
  max_steps_per_episode: 400
  eval_frequency: 50
  save_frequency: 100
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

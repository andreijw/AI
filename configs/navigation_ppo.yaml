# Navigation-v0 PPO Training Configuration (Discrete actions)
# Stable-Baselines3's PPO defaults (Adam 3e-4, gradient-norm clip 0.5, 2048-step rollouts, 10 epochs of
# 64-transition minibatches, gamma 0.99, GAE lambda 0.95, clip 0.2, value weight 0.5) on one environment, with
# one departure: an entropy bonus of 0.01 (rl-baselines3-zoo's LunarLander-v3 PPO) for exploration over the five
# actions. A rollout of 2048 transitions holds about 20 whole episodes. Learning rate and clip decay to 0 over
# the 200,000-step budget, as CartPole and Pendulum PPO.
# Measured 2026-11-07 through the benchmark on seeds 1 to 5, three runs sharing the CPU; greedy evaluation over
# 100 held-out layouts: 88% reach the goal (82 to 97% by seed), reward 6.75 ± 0.85, final 100-episode training
# averages 6.0 to 7.4; solves the 7.0 threshold on 5 of 5 seeds and holds it on 1; about 5 minutes a seed
# (docs/benchmarks/navigation_results.md).

environment:
  name: "Navigation-v0"
  render_mode: null
  max_episode_steps: 400
  seed: 42
  sensor: "hc_sr04"  # five HC-SR04 sonars; "lidar" for a lidar of lidar_beams beams
  num_obstacles: 6

agent:
  type: "ppo"
  config:
    learning_rate: 0.0003  # Adam step size at the start (SB3); decays linearly to 0 over anneal_steps
    optimizer: "adam"
    max_grad_norm: 0.5     # Global gradient-norm clip (SB3)
    anneal_steps: 200000   # Trained transitions over which learning rate and clip decay to 0
    rollout_steps: 2048    # Transitions (whole episodes) collected before each update (SB3 n_steps)
    minibatch_size: 64     # Transitions per optimizer step (SB3)
    ppo_epochs: 10         # Passes over each rollout (SB3)
    gamma: 0.99            # Discount factor (SB3): a 100-step horizon against ~80 steps to a goal
    gae_lambda: 0.95       # GAE lambda (SB3)
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss (SB3)
    entropy_coef: 0.01     # Entropy bonus weight (rl-zoo LunarLander; SB3: 0.0); not annealed
    clip_epsilon: 0.2      # PPO clip range at the start (SB3); decays with the learning rate
    seed: 42               # Weight initialisation seed

training:
  total_steps: 200000  # Environment steps (as CartPole and Pendulum PPO); equals anneal_steps
  max_steps_per_episode: 400
  eval_frequency: 50
  save_frequency: 100
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

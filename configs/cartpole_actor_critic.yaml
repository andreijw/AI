# CartPole Actor-Critic (A2C) Training Configuration
# Actor-Critic improves upon REINFORCE by replacing the scalar mean-return
# baseline with a learned, state-dependent value function (critic).  This
# reduces gradient variance and leads to faster, more stable learning.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "actor_critic"
  config:
    learning_rate: 0.001   # SGD step size
    gamma: 0.99            # Discount factor
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss
    entropy_coef: 0.01     # Entropy bonus weight (encourages exploration)
    seed: 42               # Weight initialisation seed

# Training settings
training:
  num_episodes: 1500
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

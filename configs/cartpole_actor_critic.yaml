# CartPole Actor-Critic (A2C) Training Configuration
# Actor-Critic improves upon REINFORCE by replacing the scalar mean-return
# baseline with a learned, state-dependent value function (critic).  This
# reduces gradient variance and leads to faster, more stable learning.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "actor_critic"
  config:
    learning_rate: 0.001   # Adam step size
    # SGD first reached 475 at episodes 906-1269, Adam at 490-839 (CHANGELOG.md, 2026-10-15); in the
    # benchmark it now solves at episode 946 on average (docs/benchmarks/cartpole_results.md).
    optimizer: "adam"
    gamma: 0.99            # Discount factor
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss
    entropy_coef: 0.01     # Entropy bonus weight (encourages exploration)
    # Bootstrap the 500-step time-limit cut from V(next state). Seeds 1-5 paired against it off: held 5 of 5
    # against 4, mean final average 495.9 against 481.3, solved in 231k steps against 374k (CHANGELOG.md, 2026-11-12).
    bootstrap_truncation: true
    seed: 42               # Weight initialisation seed

# Training settings
training:
  total_steps: 500000  # Environment steps (rl-zoo A2C CartPole-v1 n_timesteps)
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes (train.py also after the last)
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

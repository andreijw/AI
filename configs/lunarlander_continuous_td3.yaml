# LunarLanderContinuous-v3 TD3 Training Configuration
# rl-baselines3-zoo's TD3 settings for LunarLanderContinuous-v3 (hyperparams/td3.yml) at its 400x300 networks, SB3's
# TD3 defaults for the rest, on the PyTorch backend (backend: torch), as configs/mountaincar_continuous_td3.yaml. It
# needs PyTorch and Box2D (./setup.sh --profile gpu, then .venv-gpu/bin/python train.py ...); CI and .venv do not
# build it. Its checkpoints are TD3Agent's NumPy format.
# Like rl-zoo it updates after every environment step (training.update_every: 1, the maintainer's choice on
# 2026-11-01), so training starts at the 10,000th warm-up action. The difference from rl-zoo is the solve rule: a
# 100-episode training average of 200, exploration noise included, where rl-zoo reports a greedy evaluation. A cut at
# the 1000-step limit is stored as non-terminal.
# Benchmarked 2026-11-01 on seeds 1 to 5 at 400,000 steps: every seed reaches 200 (at 174,000 to 294,000 steps) and
# holds it (final averages 202 to 248), greedy evaluation 58 to 251 (CHANGELOG.md, 2026-11-01); held-out seeds 11 to
# 15 also all held it, mean 242.8 (CHANGELOG.md, 2026-10-30). With updates after each episode instead, 3 of 5 held on
# seeds 1 to 5 and 4 of 5 on seeds 11 to 15; the 400,000-step budget was chosen then, from a 500,000-step screen
# (CHANGELOG.md, 2026-10-28).

environment:
  name: "LunarLanderContinuous-v3"
  render_mode: null
  max_episode_steps: 1000
  seed: 42

agent:
  type: "td3"
  config:
    backend: torch                   # Gradient steps in PyTorch, as CUDA graphs on the GPU (device: auto)
    hidden_sizes: [400, 300]         # Actor and both critics' hidden layers (rl-zoo)
    learning_rate: 0.001             # Adam step size for actor and critics (rl-zoo)
    gamma: 0.98                      # Discount factor (rl-zoo)
    tau: 0.005                       # Polyak rate per actor step (every policy_delay gradient steps; SB3 default)
    batch_size: 256                  # Mini-batch size (SB3 default)
    buffer_capacity: 200000          # Replay buffer size (rl-zoo)
    learning_starts: 10000           # Uniform random actions in the bounds before learning (rl-zoo)
    noise_type: gaussian             # Exploration noise (rl-zoo: normal)
    noise_std: 0.1                   # Std in the [-1, 1] action space (rl-zoo)
    updates_per_step: 1.0            # Gradient steps per transition (rl-zoo train_freq 1, gradient_steps 1); no cap
    policy_delay: 2                  # Gradient steps per actor and target update (SB3 default)
    target_policy_noise: 0.2         # Std of the target-action smoothing noise, [-1, 1] space (SB3 default)
    target_noise_clip: 0.5           # Bound on that noise (SB3 default)
    optimizer: adam
    seed: 42

training:
  total_steps: 400000  # Environment steps (rl-zoo: 300,000); the maintainer's choice from the screen
  max_steps_per_episode: 1000  # Must match the environment's limit: the Trainer's default is 500
  update_every: 1  # Update after every environment step, as rl-zoo (train_freq 1); CHANGELOG.md, 2026-11-01
  eval_frequency: 25
  save_frequency: 50
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

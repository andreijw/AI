# Acrobot-v1 PPO Training Configuration
# Starts from rl-baselines3-zoo's Acrobot-v1 PPO settings (hyperparams/ppo.yml: 16 envs x 256 steps,
# 4 epochs, minibatch 64, gamma 0.99, GAE lambda 0.94) on one environment and without rl-zoo's
# observation and reward normalisation, which this PPO does not have. Half rl-zoo's 1M steps.

# Environment settings
environment:
  name: "Acrobot-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "ppo"
  config:
    learning_rate: 0.0003  # Adam step size at the start (SB3 default); decays linearly to 0 over anneal_steps
    optimizer: "adam"
    max_grad_norm: 0.5     # Global gradient-norm clip for Adam (SB3 default)
    anneal_steps: 500000   # Trained transitions over which learning rate and clip decay to 0
    rollout_steps: 4096    # Transitions (whole episodes) collected before each update (rl-zoo: 16 x 256)
    minibatch_size: 64     # Transitions per optimizer step (SB3 default)
    ppo_epochs: 4          # Passes over each rollout (rl-zoo)
    gamma: 0.99            # Discount factor (rl-zoo)
    gae_lambda: 0.94       # GAE lambda (rl-zoo)
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss
    entropy_coef: 0.0      # Entropy bonus weight (rl-zoo)
    clip_epsilon: 0.2      # PPO clip range at the start; decays with the learning rate
    seed: 42               # Weight initialisation seed

# Training settings
training:
  total_steps: 500000  # Environment steps (half rl-zoo's 1M); equals anneal_steps
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

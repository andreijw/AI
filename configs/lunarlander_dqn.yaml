# LunarLander-v3 Deep Q-Network (DQN) Training Configuration
# Starts from rl-baselines3-zoo's LunarLander-v3 DQN settings (hyperparams/dqn.yml, "Tuned"; the same entry as its
# Acrobot-v1 one, which configs/acrobot_dqn.yaml translates), with these differences:
# - one hidden layer of 256 where rl-zoo has two;
# - a squared-error TD loss where SB3's DQN uses smooth-L1 (Huber), which matters with LunarLander's +-100 rewards;
# - the trainer updates once per episode, so updates_per_step 1.0 with the cap at the 1000-step limit gives rl-zoo's
#   one gradient step per transition (train_freq 4, gradient_steps -1), run after each episode;
# - a longer budget: rl-zoo's 100,000 steps feed a greedy evaluation, while solving here means a 100-episode
#   training average of 200, exploration included.
# A cut at the 1000-step limit is stored as non-terminal, so the target still bootstraps from it.
# Measured 2026-10-27 (CHANGELOG.md, 2026-10-27): on seeds 1 to 5 rl-zoo's exploration floor of 0.1 reached 200
# on 5 of 5 and held it on 5 of 5 (final averages 214 to 251), against 0.02 holding on 3 of 5; on held-out seeds 11
# to 15 it reached 200 on 5 of 5 (at 166,000 to 297,000 steps) and held it on 4 of 5 (final averages 198 to 231),
# greedy evaluation 238 +/- 25. The margin is thin: seed 12 first reached 200 at 297,000 of the 300,000 steps.

# Environment settings
environment:
  name: "LunarLander-v3"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 1000
  seed: 42

# Agent settings
agent:
  type: "dqn"
  config:
    optimizer: adam                # rl-zoo / SB3 optimizer
    learning_rate: 0.00063         # rl-zoo, fixed
    max_grad_norm: 10.0            # Adam global gradient-norm clip (SB3 default)
    gamma: 0.99                    # Discount factor (rl-zoo)
    hidden_dim: 256                # One hidden layer (rl-zoo: [256, 256])
    buffer_capacity: 50000         # Replay buffer capacity (rl-zoo)
    batch_size: 128                # Training mini-batch size (rl-zoo)
    min_buffer_size: 128           # rl-zoo starts learning at once; one batch is the least we can sample
    epsilon_start: 1.0             # Initial exploration probability
    epsilon_end: 0.1               # Exploration floor (rl-zoo): held 200 on 5 of 5 seeds against 3 of 5 for 0.02
    exploration_steps: 12000       # Training actions over which epsilon falls linearly (rl-zoo: 12% of 100k)
    target_update_frequency: 250   # Gradient steps between target syncs: rl-zoo's 250 environment steps x 1.0
    updates_per_step: 1.0          # Gradient steps per transition
    max_updates_per_call: 1000     # The episode limit, so the cap never binds
    seed: 42                       # Weight initialisation and sampling seed

# Training settings
training:
  total_steps: 300000  # Environment steps (rl-zoo: 100,000); seeds first reached 200 at 152,000 to 297,000
  max_steps_per_episode: 1000  # Must match the environment's limit: the Trainer's default is 500
  eval_frequency: 50             # Evaluate every N episodes
  save_frequency: 100            # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

# CartPole REINFORCE Training Configuration
# REINFORCE (Monte Carlo Policy Gradient) is the simplest policy-gradient
# algorithm and the natural next step after the random baseline agent.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "reinforce"
  config:
    learning_rate: 0.001   # Adam step size
    optimizer: "adam"      # "sgd" solved 0 of 5 seeds in 2000 episodes; Adam 5 of 5 (CHANGELOG.md, 2026-10-15)
    gamma: 0.99            # Discount factor
    hidden_dim: 128        # Hidden layer width
    seed: 42               # Weight initialisation seed

# Training settings
training:
  total_steps: 500000  # Environment steps (no rl-zoo REINFORCE entry; same as A2C)
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

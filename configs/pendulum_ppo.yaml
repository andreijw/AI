# Pendulum Continuous PPO Training Configuration

environment:
  name: "Pendulum-v1"
  render_mode: null
  max_episode_steps: 200
  seed: 42

agent:
  type: "ppo"
  config:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    hidden_dim: 128
    value_coef: 0.5
    entropy_coef: 0.001
    clip_epsilon: 0.2
    ppo_epochs: 8
    batch_size: 64
    action_low: -2.0
    action_high: 2.0
    seed: 42

training:
  num_episodes: 500
  max_steps_per_episode: 200
  eval_frequency: 25
  save_frequency: 50
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

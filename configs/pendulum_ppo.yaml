# Pendulum Continuous PPO Training Configuration
# Trains on rollouts of whole episodes (at least 2048 transitions: 11 episodes of 200 steps), each time-limit cut
# bootstrapped. Measured 2026-10-18 under the 100-episode rule: 9 of seeds 1-10 solve within 200,000 steps and 8
# hold; one episode per update solved 0 of 5 (roadmap: "Pendulum PPO Holds -200 Under the 100-Episode Rule").

environment:
  name: "Pendulum-v1"
  render_mode: null
  max_episode_steps: 200
  seed: 42

agent:
  type: "ppo"
  config:
    learning_rate: 0.001     # Adam step size at the start; annealed to 0 over anneal_steps
    gamma: 0.9               # Short horizon; 0.99 solved no seed
    gae_lambda: 0.95
    hidden_dim: 128
    value_coef: 0.5
    entropy_coef: 0.001
    clip_epsilon: 0.2
    reward_scale: 0.1        # Rewards of -16..0 per step scaled before returns; keeps the critic in range
    anneal_steps: 200000     # Learning rate and clip decay to 0 over the whole training budget
    rollout_steps: 2048      # Transitions buffered, in whole episodes, per update (rl-zoo: 4 x 1024)
    ppo_epochs: 10           # Passes over each rollout (rl-zoo)
    batch_size: 64
    action_low: -2.0
    action_high: 2.0
    seed: 42

training:
  total_steps: 200000  # Environment steps: twice rl-zoo's 100,000 (as CartPole PPO); equals anneal_steps
  max_steps_per_episode: 200
  eval_frequency: 25
  save_frequency: 50
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

# Pendulum Continuous PPO Training Configuration
# Measured 2026-10-15 under the old 10-episode rule: the training average touched -200 on 5 of 5 seeds within
# 500 episodes. Under the 100-episode rule at 100,000 steps (2026-10-16, seeds 1-5,
# docs/benchmarks/pendulum_results.md) it solves 0 of 5, final averages -241 to -313 (roadmap: "Pendulum PPO
# Holds -200 Under the 100-Episode Rule").

environment:
  name: "Pendulum-v1"
  render_mode: null
  max_episode_steps: 200
  seed: 42

agent:
  type: "ppo"
  config:
    learning_rate: 0.001     # Adam step size at the start; annealed to 0 over anneal_steps
    gamma: 0.9               # Short horizon; 0.99 solved no seed
    gae_lambda: 0.95
    hidden_dim: 128
    value_coef: 0.5
    entropy_coef: 0.001
    clip_epsilon: 0.2
    reward_scale: 0.1        # Rewards of -16..0 per step scaled before returns; keeps the critic in range
    anneal_steps: 100000     # Learning rate and clip decay to 0 over the 500 x 200 training transitions
    ppo_epochs: 8
    batch_size: 64
    action_low: -2.0
    action_high: 2.0
    seed: 42

training:
  total_steps: 100000  # Environment steps (rl-zoo PPO Pendulum-v1 n_timesteps; equals anneal_steps)
  max_steps_per_episode: 200
  eval_frequency: 25
  save_frequency: 50
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

logging:
  level: "INFO"
  log_metrics: true

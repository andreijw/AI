# Environment Configuration for CartPole RL

# Basic environment settings
name: "CartPole-v1"  # Name of the Gymnasium environment to create
render_mode: null  # Options: null, 'human', 'rgb_array'
max_episode_steps: 500
seed: 42

# Observation noise settings
# Standard deviation of Gaussian noise added to observations (0.0 = no noise)
obs_noise_std: 0.0

# Partial observability and history (every challenge), applied after the observation noise
# Zero the velocity entries (CartPole: cart and pole velocity), keeping the observation's length;
# refused where the observation has no velocity entries (Navigation)
mask_velocity: false
# Number of observations, oldest first, the agent sees as one vector (1 = off)
frame_stack: 1
# Give the stack as its newest frame, then the differences between frames, newest first (needs frame_stack >= 2)
frame_deltas: false

# Action noise settings  
# Probability of randomly flipping the action (0.0 = no noise, 1.0 = always flip)
action_noise_prob: 0.0

# Domain randomization settings
# Randomize physical parameters at the start of each episode
# Set to null to disable, or specify min/max ranges for each parameter
domain_randomization: null
# Examples (uncomment and modify as needed):
#   gravity: [9.0, 10.0]      # Default: 9.8
#   masscart: [0.8, 1.2]      # Default: 1.0
#   masspole: [0.08, 0.12]    # Default: 0.1
#   length: [0.4, 0.6]        # Default: 0.5 (half-length of pole)
# Every range's lower bound must be above 0.

# Curriculum (optional): train from easier settings up to the ones above, which evaluation always plays.
# start names settings turned on above; see docs/usage.md "Curriculum" for the modes. Example:
# curriculum:
#   mode: reward_threshold     # linear | step | reward_threshold
#   stages: 4
#   threshold: 400.0           # training average reward of the stage's last `window` episodes to advance
#   window: 20
#   min_episodes_per_stage: 20 # at least window
#   start: {obs_noise_std: 0.0, domain_randomization: {length: [0.5, 0.5]}}

# Vectorized environment settings (for parallel training)
# NOTE: The previous nested `vectorized:` block (enabled/num_envs/async_envs)
# was not consumed by `make_vec_env_from_config()` (which reads only top-level
# keys), so it has been removed to avoid confusion. Configure any vectorized
# environment behavior using the top-level keys expected by your training code.
# `async_envs` here is read only by CartPole's and Pendulum's make_vec_env; it has
# no effect on train.py. Training from several environments is `training.num_envs`
# (docs/usage.md, "Several training environments").

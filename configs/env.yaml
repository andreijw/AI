# Environment Configuration for CartPole RL

# Basic environment settings
name: "CartPole-v1"  # Name of the Gymnasium environment to create
render_mode: null  # Options: null, 'human', 'rgb_array'
max_episode_steps: 500
seed: 42

# Observation noise settings
# Standard deviation of Gaussian noise added to observations (0.0 = no noise)
obs_noise_std: 0.0

# Action noise settings  
# Probability of randomly flipping the action (0.0 = no noise, 1.0 = always flip)
action_noise_prob: 0.0

# Domain randomization settings
# Randomize physical parameters at the start of each episode
# Set to null to disable, or specify min/max ranges for each parameter
domain_randomization: null
# Examples (uncomment and modify as needed):
# gravity: [9.0, 10.0]      # Default: 9.8
# masscart: [0.8, 1.2]      # Default: 1.0
# masspole: [0.08, 0.12]    # Default: 0.1
# length: [0.4, 0.6]        # Default: 0.5 (half-length of pole)

# Vectorized environment settings (for parallel training)
# NOTE: The previous nested `vectorized:` block (enabled/num_envs/async_envs)
# was not consumed by `make_vec_env_from_config()` (which reads only top-level
# keys), so it has been removed to avoid confusion. Configure any vectorized
# environment behavior using the top-level keys expected by your training code.

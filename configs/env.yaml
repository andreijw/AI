# CartPole Environment Configuration

# Base environment settings
env_name: "CartPole-v1"
render_mode: null  # Can be "human", "rgb_array", or null

# Noise settings
observation_noise:
  enabled: false
  std: 0.01  # Standard deviation of Gaussian noise

action_noise:
  enabled: false
  std: 0.01  # Standard deviation of Gaussian noise

# Domain randomization settings
domain_randomization:
  enabled: false
  gravity:
    min: 8.0
    max: 12.0
  pole_length:
    min: 0.4
    max: 0.6
  cart_mass:
    min: 0.8
    max: 1.2

# Vectorized environment settings
num_envs: 1

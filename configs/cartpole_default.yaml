# CartPole RL Training Configuration

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42
  
  # Environment augmentation (for robust training)
  observation_noise_std: 0.0  # Standard deviation of Gaussian observation noise
  action_noise_std: 0.0       # Probability (0.0-1.0) of random action flipping
  
  # Domain randomization (randomizes physics on each episode)
  domain_randomization:
    enabled: false
    gravity:
      min: 9.0
      max: 11.0
    pole_length:
      min: 0.45
      max: 0.55
    cart_mass:
      min: 0.9
      max: 1.1

# Agent settings
agent:
  type: "random"  # Options: "random", "ppo" (ppo not yet implemented)
  # Future PPO hyperparameters will go here
  config:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coef: 0.5
    entropy_coef: 0.01

# Training settings
training:
  num_episodes: 1000
  max_steps_per_episode: 500
  eval_frequency: 100  # Evaluate every N episodes
  save_frequency: 100  # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

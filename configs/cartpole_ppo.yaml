# CartPole PPO Training Configuration
# PPO is the next progression after actor-critic: it keeps the actor-critic
# setup but adds clipped policy updates for more stable optimization.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "ppo"
  config:
    learning_rate: 0.0003  # SGD step size
    gamma: 0.99            # Discount factor
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss
    entropy_coef: 0.01     # Entropy bonus weight
    clip_epsilon: 0.2      # PPO clip range
    ppo_epochs: 4          # Optimization epochs per trajectory update
    gae_lambda: 0.95       # Reserved for future GAE-style advantages
    seed: 42               # Weight initialisation seed

# Training settings
training:
  num_episodes: 1500
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

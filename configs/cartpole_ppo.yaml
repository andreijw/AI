# CartPole PPO Training Configuration
# Standard PPO: rollouts of whole episodes, GAE, mini-batch epochs, and a learning rate and clip range
# decayed linearly to zero. Values follow rl-baselines3-zoo's CartPole-v1 PPO settings; measured on
# seeds 1 to 5 on 2026-10-16 (100-episode window): every seed's training average reached 475 within
# 73k to 199k steps, 4 of 5 held it, and every final evaluation scored 500.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "ppo"
  config:
    learning_rate: 0.001   # Adam step size at the start; decays linearly to 0 over anneal_steps
    optimizer: "adam"      # The earlier per-episode PPO with plain SGD solved 0 of 5 seeds
    max_grad_norm: 0.5     # Global gradient-norm clip for Adam
    anneal_steps: 200000   # Trained transitions over which learning rate and clip decay to 0
    rollout_steps: 256     # Transitions (whole episodes) collected before each update
    minibatch_size: 256    # Transitions per optimizer step
    ppo_epochs: 20         # Passes over each rollout
    gamma: 0.98            # Discount factor
    gae_lambda: 0.8        # GAE lambda
    hidden_dim: 128        # Shared hidden layer width
    value_coef: 0.5        # Weight for the critic (value) loss
    entropy_coef: 0.0      # Entropy bonus weight
    clip_epsilon: 0.2      # PPO clip range at the start; decays with the learning rate
    seed: 42               # Weight initialisation seed

# Training settings
training:
  total_steps: 200000  # Environment steps (2x rl-zoo PPO (100k with 8 envs; we use 1); equals anneal_steps)
  max_steps_per_episode: 500
  eval_frequency: 100   # Evaluate every N episodes
  save_frequency: 200   # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

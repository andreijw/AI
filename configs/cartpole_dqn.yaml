# CartPole Deep Q-Network (DQN) Training Configuration
# DQN uses an experience replay buffer and a separate target network
# to stabilize temporal difference learning in discrete action spaces.

# Environment settings
environment:
  name: "CartPole-v1"
  render_mode: null  # Set to 'human' for visualization
  max_episode_steps: 500
  seed: 42

# Agent settings
agent:
  type: "dqn"
  config:
    optimizer: adam                # Agent default sgd. Adam solved 5 of 5; old SGD settings 1 of 5 (200k)
    learning_rate: 0.001           # Adam step size
    max_grad_norm: 10.0            # Adam global gradient-norm clip (rl-zoo / SB3 default)
    gamma: 0.99                    # Discount factor
    hidden_dim: 128                # Shared hidden layer width
    buffer_capacity: 20000         # Replay buffer maximum capacity
    batch_size: 64                 # Training mini-batch size
    min_buffer_size: 100           # Minimum replay buffer samples before training
    epsilon_start: 1.0             # Initial exploration probability
    epsilon_end: 0.04              # Exploration probability once exploration_steps have passed (rl-zoo)
    exploration_steps: 8000        # Training actions over which epsilon falls linearly (rl-zoo: 16% of 50k)
    target_update_frequency: 128   # Gradient steps between target network syncs
    updates_per_step: 1.0          # Gradient steps per transition, before the cap below
    max_updates_per_call: 64       # Cap on gradient steps per episode (binds once episodes exceed 64 steps)
    seed: 42                       # Weight initialisation and sampling seed

# Training settings
training:
  total_steps: 300000  # Environment steps: rl-zoo's 50k cannot hold a 100-episode average of 475 (CHANGELOG.md, 2026-10-18)
  max_steps_per_episode: 500
  eval_frequency: 50             # Evaluate every N episodes
  save_frequency: 100            # Save checkpoint every N episodes
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

# Logging settings
logging:
  level: "INFO"
  log_metrics: true

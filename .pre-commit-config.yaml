# Pre-commit hooks for code quality
# pre-commit itself comes with requirements-dev.txt; set up with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Ruff, mypy and Bandit run from this checkout's virtual environment (language: system), so pre-commit uses the
  # versions in requirements-lock.txt, as CI does. The entries are the tools' own commands, found on PATH: commit from
  # the activated .venv.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        files: ^(packages/|benchmark\.py$)
      - id: bandit
        name: bandit
        entry: bandit -ll -r packages/ benchmark.py
        language: system
        pass_filenames: false
        files: ^(packages/|benchmark\.py$)

  # Markdown linting, at the version ci.yml's MARKDOWNLINT_CLI_VERSION names (tests/test_versions.py)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--fix]

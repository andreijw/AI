[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-core"
dynamic = ["version"]
description = "A pure-NumPy reinforcement-learning framework: agents, trainer, challenge interface and export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "andreijw"}]
keywords = ["reinforcement-learning", "gymnasium", "numpy", "rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.9.4",
]

[project.optional-dependencies]
video = [
    "moviepy>=1.0.0",
    "imageio-ffmpeg>=0.4.0",
    "gymnasium[classic-control]>=1.0.0",
]
# The optional PyTorch backend (backend: torch). On the Jetson it installs from PyTorch's own index:
# see docs/pytorch_jetson_timing.md.
torch = [
    "torch>=2.14",
]
# ONNX export (export.py --format onnx): onnx builds and checks the model, onnxruntime verifies it.
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://github.com/andreijw/AI"
Repository = "https://github.com/andreijw/AI"
Issues = "https://github.com/andreijw/AI/issues"

[tool.setuptools.dynamic]
version = {attr = "rl_core.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: a project type-checking against these packages uses their annotations.
[tool.setuptools.package-data]
"*" = ["py.typed"]

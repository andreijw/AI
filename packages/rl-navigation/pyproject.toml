[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-navigation"
dynamic = ["version"]
description = "Range-sensor robot navigation: a NumPy simulator, localization, mapping and landmark SLAM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "andreijw"}]
keywords = ["robotics", "navigation", "localization", "slam", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# The robot's libraries (sim, estimation, mapping, slam) need NumPy only. 1.26 is ROS 2 Jazzy's (Ubuntu 24.04's
# apt NumPy) and the oldest the Packages CI job tests them with.
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# rl_navigation.gym_env: the Gymnasium environments Navigation-v0 and NavigationContinuous-v0.
gym = [
    "gymnasium>=1.0.0",
]
# rl_navigation.environments and rl_navigation.benchmark: the navigation challenge on the framework.
challenge = [
    "rl-core~=0.1.0",
    "gymnasium>=1.0.0",
]
# rl_navigation.localization_video: an MP4 of a localization trial, and its stills.
video = [
    "imageio-ffmpeg>=0.4.0",
    "matplotlib>=3.9.4",
]

[project.entry-points."rl_core.challenges"]
rl_navigation = "rl_navigation.benchmark"

[project.urls]
Homepage = "https://github.com/andreijw/AI"
Repository = "https://github.com/andreijw/AI"
Issues = "https://github.com/andreijw/AI/issues"

[tool.setuptools.dynamic]
version = {attr = "rl_navigation.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: a project type-checking against these packages uses their annotations.
[tool.setuptools.package-data]
"*" = ["py.typed"]

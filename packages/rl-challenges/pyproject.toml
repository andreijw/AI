[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-challenges"
dynamic = ["version"]
description = "Benchmark challenges for rl-core: CartPole, Pendulum, Acrobot, MountainCar, LunarLander, BipedalWalker"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "andreijw"}]
keywords = ["reinforcement-learning", "benchmark", "gymnasium", "cartpole"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# What its modules import directly, not only through rl-core.
dependencies = [
    "rl-core~=0.2.0",
    "gymnasium>=1.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# LunarLander and BipedalWalker (Box2D). Gymnasium's own box2d extra pins box2d==2.3.10, which has no aarch64 build;
# box2d-py builds from source with swig, which pip's isolated build cannot find, so install it first
# as ./setup.sh does (docs/usage.md, LunarLander (Box2D)). Rendering uses pygame-ce, as Gymnasium does.
box2d = [
    "box2d-py>=2.3.8",
    "pygame-ce>=2.1.3",
]

# Challenge discovery (rl_core.challenges.discover_challenges): one entry per package, named after it.
# A new challenge package adds its line here; tests/test_challenge_registry.py checks none is missing.
[project.entry-points."rl_core.challenges"]
rl_acrobot = "rl_acrobot.benchmark"
rl_bipedalwalker = "rl_bipedalwalker.benchmark"
rl_cartpole = "rl_cartpole.benchmark"
rl_lunarlander = "rl_lunarlander.benchmark"
rl_mountaincar = "rl_mountaincar.benchmark"
rl_pendulum = "rl_pendulum.benchmark"

[project.urls]
Homepage = "https://github.com/andreijw/AI"
Repository = "https://github.com/andreijw/AI"
Issues = "https://github.com/andreijw/AI/issues"

# Six import packages share one version; it is defined in rl_cartpole, the first challenge.
[tool.setuptools.dynamic]
version = {attr = "rl_cartpole.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: a project type-checking against these packages uses their annotations.
[tool.setuptools.package-data]
"*" = ["py.typed"]
